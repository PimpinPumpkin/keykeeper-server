# Runs PassBundle's Tier 1 suite against this commit of the server.
name: CI

on:
  push:
    branches: [keykeeper]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tier1:
    uses: PimpinPumpkin/Passbundle/.github/workflows/tier1.yml@main
    with:
      server-ref: ${{ github.sha }}
